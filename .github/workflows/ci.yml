name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: '17 10 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Lint
      run: pnpm lint

    - name: Typecheck
      run: pnpm typecheck

    - name: Run offline tests with coverage
      run: pnpm test:coverage

    - name: Upload coverage report
      if: matrix.node-version == 24
      uses: actions/upload-artifact@v7
      with:
        name: coverage-node-24
        path: coverage/
        if-no-files-found: error
        retention-days: 14

  package-integrity:
    name: Package integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

    - name: Use Node.js 24.x
      uses: actions/setup-node@v6
      with:
        node-version: 24.x
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Audit production dependencies
      run: pnpm audit --prod --audit-level=high

    - name: Verify the built CommonJS package
      run: pnpm test:package

    - name: Inspect the npm package contents
      run: npm pack --dry-run

  pdq-oracle-conformance:
    name: PDQ oracle conformance (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Use Node.js 24.x
      uses: actions/setup-node@v6
      with:
        node-version: 24.x
        package-manager-cache: false

    - name: Build the pinned C++ oracle
      run: ./scripts/build-pdq-oracle.sh --output "$RUNNER_TEMP/pdq-oracle-build"
      env:
        PDQ_ORACLE_CXX: clang++-18

    - name: Verify the oracle protocol and raw-pixel behavior
      run: node scripts/pdq-oracle-smoke.mjs --oracle "$RUNNER_TEMP/pdq-oracle-build/pdq-oracle"

    - name: Regenerate and compare the synthetic corpus
      run: |
        node scripts/generate-pdq-fixtures.mjs \
          --oracle "$RUNNER_TEMP/pdq-oracle-build/pdq-oracle" \
          --output "$RUNNER_TEMP/raw-vectors.json"
        cmp __tests__/fixtures/pdq/raw-vectors.json "$RUNNER_TEMP/raw-vectors.json"

  network-smoke:
    name: Live network smoke
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

    - name: Use Node.js 24.x
      uses: actions/setup-node@v6
      with:
        node-version: 24.x
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run live remote-image tests
      run: pnpm test:network

  deploy:
    runs-on: ubuntu-latest
    needs: [ verify, package-integrity, pdq-oracle-conformance ]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

    - name: Use Node.js 24.x
      uses: actions/setup-node@v6
      with:
        node-version: 24.x
        package-manager-cache: false
        registry-url: 'https://registry.npmjs.org'

    - name: Configure Git
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Actions"

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run tests
      run: pnpm check

    - name: Version bump
      run: pnpm version patch

    - name: Build
      run: pnpm run build

    - name: Publish to npm
      run: pnpm publish --no-git-checks
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    - name: Push version changes
      run: |
        git push origin master
        git push origin --tags
