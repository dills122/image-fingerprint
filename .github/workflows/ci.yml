name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 10 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      quality: ${{ steps.paths.outputs.quality }}
      dependencies: ${{ steps.paths.outputs.dependencies }}
      package: ${{ steps.paths.outputs.package }}
      oracle: ${{ steps.paths.outputs.oracle }}
      browser: ${{ steps.paths.outputs.browser }}
      site: ${{ steps.paths.outputs.site }}

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Classify changed paths
      id: paths
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        set -euo pipefail
        if [[ "$EVENT_NAME" != "pull_request" && "$EVENT_NAME" != "push" ]] \
          || [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
          .github/scripts/classify-ci-paths.sh --all >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [[ "$EVENT_NAME" == "pull_request" ]]; then
          git diff --name-only --diff-filter=ACMRD "$BASE_SHA...$HEAD_SHA" \
            > "$RUNNER_TEMP/changed-paths.txt"
        else
          git diff --name-only --diff-filter=ACMRD "$BASE_SHA" "$HEAD_SHA" \
            > "$RUNNER_TEMP/changed-paths.txt"
        fi
        .github/scripts/classify-ci-paths.sh "$RUNNER_TEMP/changed-paths.txt" \
          >> "$GITHUB_OUTPUT"

  verify:
    name: Verify (${{ matrix.profile }})
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 22
            profile: Node.js 22 compatibility
            coverage: false
          - node-version: 24
            profile: Node.js 24 quality
            coverage: true

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Lint
      if: matrix.coverage
      run: pnpm lint

    - name: Typecheck
      if: matrix.coverage
      run: pnpm typecheck

    - name: Run offline tests
      if: ${{ !matrix.coverage }}
      run: pnpm test

    - name: Run offline tests with coverage
      if: matrix.coverage
      run: pnpm test:coverage

    - name: Upload coverage report
      if: matrix.coverage
      uses: actions/upload-artifact@v7
      with:
        name: coverage-node-24
        path: coverage/
        if-no-files-found: error
        retention-days: 14

  dependency-audit:
    name: Dependency audit
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

    - name: Use Node.js 24.x
      uses: actions/setup-node@v6
      with:
        node-version: 24.x
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Audit locked dependencies
      run: pnpm audit --audit-level=high

  package-integrity:
    name: Package integrity
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

    - name: Use Node.js 24.x
      uses: actions/setup-node@v6
      with:
        node-version: 24.x
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Verify the built CommonJS package
      run: pnpm test:package

    - name: Verify the npm package contents
      run: pnpm pack:check

  pdq-oracle-conformance:
    name: PDQ oracle conformance (Linux arm64)
    needs: changes
    if: needs.changes.outputs.oracle == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Use Node.js 24.x
      uses: actions/setup-node@v6
      with:
        node-version: 24.x
        package-manager-cache: false

    - name: Restore the pinned oracle build
      id: oracle-cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ runner.temp }}/pdq-oracle-build/pdq-oracle
        key: pdq-oracle-${{ runner.os }}-${{ runner.arch }}-clang18-${{ hashFiles('scripts/build-pdq-oracle.sh', 'tools/pdq-oracle/main.cpp') }}

    - name: Build the pinned C++ oracle
      if: steps.oracle-cache.outputs.cache-hit != 'true'
      run: ./scripts/build-pdq-oracle.sh --output "$RUNNER_TEMP/pdq-oracle-build"
      env:
        PDQ_ORACLE_CXX: clang++-18

    - name: Verify the oracle protocol and raw-pixel behavior
      run: node scripts/pdq-oracle-smoke.mjs --oracle "$RUNNER_TEMP/pdq-oracle-build/pdq-oracle"

    - name: Regenerate and compare the raw-pixel corpus
      run: |
        node scripts/generate-pdq-fixtures.mjs \
          --oracle "$RUNNER_TEMP/pdq-oracle-build/pdq-oracle" \
          --output "$RUNNER_TEMP/raw-vectors.json"
        cmp __tests__/fixtures/pdq/raw-vectors.json "$RUNNER_TEMP/raw-vectors.json"

    - name: Regenerate and compare the internal-stage corpus
      run: |
        node scripts/generate-pdq-stage-fixtures.mjs \
          --oracle "$RUNNER_TEMP/pdq-oracle-build/pdq-oracle" \
          --output "$RUNNER_TEMP/stage-vectors.json"
        cmp __tests__/fixtures/pdq/stage-vectors.json "$RUNNER_TEMP/stage-vectors.json"

  browser-conformance:
    name: Browser and worker conformance
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

    - name: Use Node.js 24.x
      uses: actions/setup-node@v6
      with:
        node-version: 24.x
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Install matched browser engines
      run: pnpm exec playwright install --with-deps chromium firefox webkit

    - name: Verify packed browser and worker behavior
      run: pnpm test:browser

  site-build:
    name: Project site build
    needs: changes
    if: needs.changes.outputs.site == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

    - name: Use Node.js 24.x
      uses: actions/setup-node@v6
      with:
        node-version: 24.x
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build the project site
      run: pnpm --dir site build
