name: CI

on:
  push:
    branches: [ master, main, "codex/**" ]
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: '17 10 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Lint
      run: pnpm lint

    - name: Typecheck
      run: pnpm typecheck

    - name: Run offline tests with coverage
      run: pnpm test:coverage

    - name: Upload coverage report
      if: matrix.node-version == 24
      uses: actions/upload-artifact@v7
      with:
        name: coverage-node-24
        path: coverage/
        if-no-files-found: error
        retention-days: 14

  package-integrity:
    name: Package integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

    - name: Use Node.js 24.x
      uses: actions/setup-node@v6
      with:
        node-version: 24.x
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Audit production dependencies
      run: pnpm audit --prod --audit-level=high

    - name: Verify the built CommonJS package
      run: pnpm test:package

    - name: Verify the npm package contents
      run: pnpm pack:check

  pdq-oracle-conformance:
    name: PDQ oracle conformance (Linux arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Use Node.js 24.x
      uses: actions/setup-node@v6
      with:
        node-version: 24.x
        package-manager-cache: false

    - name: Build the pinned C++ oracle
      run: ./scripts/build-pdq-oracle.sh --output "$RUNNER_TEMP/pdq-oracle-build"
      env:
        PDQ_ORACLE_CXX: clang++-18

    - name: Verify the oracle protocol and raw-pixel behavior
      run: node scripts/pdq-oracle-smoke.mjs --oracle "$RUNNER_TEMP/pdq-oracle-build/pdq-oracle"

    - name: Regenerate and compare the raw-pixel corpus
      run: |
        node scripts/generate-pdq-fixtures.mjs \
          --oracle "$RUNNER_TEMP/pdq-oracle-build/pdq-oracle" \
          --output "$RUNNER_TEMP/raw-vectors.json"
        cmp __tests__/fixtures/pdq/raw-vectors.json "$RUNNER_TEMP/raw-vectors.json"

    - name: Regenerate and compare the internal-stage corpus
      run: |
        node scripts/generate-pdq-stage-fixtures.mjs \
          --oracle "$RUNNER_TEMP/pdq-oracle-build/pdq-oracle" \
          --output "$RUNNER_TEMP/stage-vectors.json"
        cmp __tests__/fixtures/pdq/stage-vectors.json "$RUNNER_TEMP/stage-vectors.json"

  browser-conformance:
    name: Browser and worker conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

    - name: Use Node.js 24.x
      uses: actions/setup-node@v6
      with:
        node-version: 24.x
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Install matched browser engines
      run: pnpm exec playwright install --with-deps chromium firefox webkit

    - name: Verify packed browser and worker behavior
      run: pnpm test:browser

  network-smoke:
    name: Live network smoke
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

    - name: Use Node.js 24.x
      uses: actions/setup-node@v6
      with:
        node-version: 24.x
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run live remote-image tests
      run: pnpm test:network
