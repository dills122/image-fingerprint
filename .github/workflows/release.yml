name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag and quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      package_name: ${{ steps.package.outputs.name }}
      package_version: ${{ steps.package.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify the tag points at the current main commit
        run: |
          git fetch origin main --depth=1
          main_sha="$(git rev-parse origin/main)"
          if [ "$GITHUB_SHA" != "$main_sha" ]; then
            echo "Release tag must point at the current main commit ($main_sha)"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Read package metadata
        id: package
        run: |
          printf 'name=%s\n' "$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches package version
        run: |
          expected="v${{ steps.package.outputs.version }}"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $expected"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gates
        run: pnpm check

      - name: Verify package contents
        run: pnpm pack:check

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js for npmjs
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish package to npmjs with trusted publishing
        shell: bash
        run: |
          publish_args=(--access public)
          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            publish_args+=(--tag next)
          fi
          npm publish "${publish_args[@]}"
        env:
          PACKAGE_VERSION: ${{ needs.verify.outputs.package_version }}

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - verify
      - publish-npm
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release tarball
        run: npm pack

      - name: Publish GitHub release with notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(needs.verify.outputs.package_version, '-') }}
          files: ${{ needs.verify.outputs.package_name }}-${{ needs.verify.outputs.package_version }}.tgz
