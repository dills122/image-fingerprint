<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>image-hash browser smoke</title>
  </head>
  <body data-status="pending">Running browser package smoke…</body>
  <script type="module">
    import { fingerprintPixels } from '../lib/esm/browser.mjs';

    const fingerprint = fingerprintPixels({
      width: 2,
      height: 2,
      data: new Uint8ClampedArray([
        0, 0, 0, 255,
        255, 255, 255, 255,
        64, 64, 64, 255,
        192, 192, 192, 255,
      ]),
    }, {
      algorithm: 'blockhash-v1',
      bitsPerSide: 2,
      method: 2,
    });

    const expected = JSON.stringify({
      schemaVersion: 1,
      algorithm: 'blockhash-v1',
      encoding: 'hex',
      hash: '5',
      bitLength: 4,
      parameters: {
        bitsPerSide: 2,
        method: 2,
      },
    });
    const actual = JSON.stringify(fingerprint);

    if (actual !== expected) {
      document.body.dataset.status = 'failed';
      document.body.textContent = `Expected ${expected}, received ${actual}`;
      throw new Error(document.body.textContent);
    }

    const pdqFingerprint = fingerprintPixels({
      format: 'gray8',
      width: 5,
      height: 5,
      data: Uint8Array.from([
        0, 41, 82, 123, 164,
        13, 54, 95, 136, 177,
        26, 67, 108, 149, 190,
        39, 80, 121, 162, 203,
        52, 93, 134, 175, 216,
      ]),
    }, {
      algorithm: 'pdq-v1',
    });
    const expectedPdq = JSON.stringify({
      schemaVersion: 1,
      algorithm: 'pdq-v1',
      encoding: 'hex',
      hash: 'd4b5348d96a593a4695a93b493a4d9263b0ec67196a59b2693a4348d6cdb6ccb',
      bitLength: 256,
      quality: 59,
    });
    const actualPdq = JSON.stringify(pdqFingerprint);

    if (actualPdq !== expectedPdq) {
      document.body.dataset.status = 'failed';
      document.body.textContent = `Expected ${expectedPdq}, received ${actualPdq}`;
      throw new Error(document.body.textContent);
    }

    document.body.dataset.status = 'passed';
    document.body.textContent = JSON.stringify({ blockhash: fingerprint, pdq: pdqFingerprint });
  </script>
</html>
