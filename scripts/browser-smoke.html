<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>image-fingerprint browser smoke</title>
  </head>
  <body data-status="pending" data-main-status="pending" data-worker-status="pending">
    Running browser package smoke…
  </body>
  <script type="module">
    import {
      decodeImage,
      fingerprintImage,
      fingerprintPixels,
    } from '/node_modules/image-fingerprint/lib/esm/browser.mjs';

    const gray = [
      0, 41, 82, 123, 164,
      13, 54, 95, 136, 177,
      26, 67, 108, 149, 190,
      39, 80, 121, 162, 203,
      52, 93, 134, 175, 216,
    ];
    const sources = {
      gray8: gray,
      rgb8: gray.flatMap((value) => [value, value, value]),
      rgba8: gray.flatMap((value) => [value, value, value, 255]),
    };
    const expected = {
      schemaVersion: 1,
      algorithm: 'pdq-v1',
      encoding: 'hex',
      hash: 'd4b5348d96a593a4695a93b493a4d9263b0ec67196a59b2693a4348d6cdb6ccb',
      bitLength: 256,
      quality: 59,
    };

    const options = { algorithm: 'pdq-v1' };
    const hashSources = () => Object.fromEntries(Object.entries(sources).map(([format, data]) => [
      format,
      fingerprintPixels({
        format,
        width: 5,
        height: 5,
        data: Uint8Array.from(data),
      }, options),
    ]));

    const hashAdapters = async () => {
      const imageData = new ImageData(Uint8ClampedArray.from(sources.rgba8), 5, 5);
      const imageDataFingerprint = await fingerprintImage(imageData, options);
      const response = await fetch('/scripts/Example.png');
      if (!response.ok) throw new Error(`fixture request failed: ${response.status}`);
      const blob = await response.blob();
      const file = new File([blob], 'Example.png', { type: 'image/png' });
      const decoded = await decodeImage(blob);
      const decodedFingerprint = fingerprintPixels(decoded, options);
      const [blobFingerprint, fileFingerprint] = await Promise.all([
        fingerprintImage(blob, options),
        fingerprintImage(file, options),
      ]);
      if (JSON.stringify(blobFingerprint) !== JSON.stringify(decodedFingerprint)) {
        throw new Error('Blob fingerprint did not match decodeImage plus fingerprintPixels');
      }
      if (JSON.stringify(fileFingerprint) !== JSON.stringify(decodedFingerprint)) {
        throw new Error('File fingerprint did not match decodeImage plus fingerprintPixels');
      }
      return {
        imageData: imageDataFingerprint,
        blob: blobFingerprint,
        file: fileFingerprint,
        decodedPixels: decodedFingerprint,
        width: decoded.width,
        height: decoded.height,
      };
    };

    const assertResults = (results, context) => {
      for (const [format, fingerprint] of Object.entries(results)) {
        if (JSON.stringify(fingerprint) !== JSON.stringify(expected)) {
          throw new Error(
            `${context} ${format}: expected ${JSON.stringify(expected)}, received ${JSON.stringify(fingerprint)}`,
          );
        }
      }
    };

    const fail = (error) => {
      document.body.dataset.status = 'failed';
      document.body.textContent = error instanceof Error ? error.message : String(error);
      throw error;
    };

    try {
      const mainThread = {
        rawPixels: hashSources(),
        adapters: await hashAdapters(),
      };
      assertResults(mainThread.rawPixels, 'main-thread');
      document.body.dataset.mainStatus = 'passed';

      const worker = new Worker('/scripts/browser-smoke-worker.mjs', { type: 'module' });
      worker.addEventListener('error', fail, { once: true });
      worker.addEventListener('message', ({ data }) => {
        try {
          if (data.error !== undefined) {
            throw new Error(data.error);
          }
          assertResults(data.results.rawPixels, 'module-worker');
          document.body.dataset.workerStatus = 'passed';
          document.body.dataset.status = 'passed';
          document.body.textContent = JSON.stringify({
            mainThread,
            moduleWorker: data.results,
          });
          worker.terminate();
        } catch (error) {
          fail(error);
        }
      }, { once: true });
      worker.postMessage({ sources, encodedUrl: '/scripts/Example.png' });
    } catch (error) {
      fail(error);
    }
  </script>
</html>
